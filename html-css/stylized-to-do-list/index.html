<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css">
    <title>Styled To-Do List</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <ul class="todo-list">
            <li>
                <input type="checkbox" id="task1" />
                <label for="task1">Explore gaming keyboards</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://www.yunzii.com/de?srsltid=AfmBOoqqIj4uve7DMEify3FEhYeRqaZLs6B1VIXCo4rUQuWRmavl88s5" target="_blank">Yunzii Keyboards</a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="task2" />
                <label for="task2">Watch C++ tutorial on YouTube</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://www.youtube.com/watch?v=ZzaPdXTrSb8" target="_blank">Video Link</a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="task3" />
                <label for="task3">Check Processor Specs</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://www.intel.com/content/www/us/en/products/sku/230501/intel-core-i513400f-processor-20m-cache-up-to-4-60-ghz/specifications.html" target="_blank">View Specs</a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="task4" />
                <label for="task4">Look up a review of The Imitation Game</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://www.rottentomatoes.com/m/the_imitation_game" target="_blank">Review on Rotten Tomatoes</a>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</body>

</html>
