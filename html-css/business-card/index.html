<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Business Card</title>
    <link rel="stylesheet" href="styles.css" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="business-card">
        <img class="profile-image" src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="Profile Image" />
        <p class="full-name">Elvin Delic</p>
        <p class="designation">Frontend Learner</p>
        <p class="company">freeCodeCamp learning project</p>
        <hr>
        <p>Email: elvin@example.com</p>
        <p>Phone: Demo contact</p>
        <a class="portfolio-link" href="https://www.freecodecamp.org/elvinooo">Portfolio</a>
        <hr>
        <div class="social-media">
            <h2>Connect with me</h2>
            <a href="https://x.com">Twitter</a> <a href="https://de.linkedin.com">LinkedIn</a> <a href="https://github.com">GitHub</a>
        </div>
    </div>
</body>

</html>
