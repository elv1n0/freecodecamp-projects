<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Contact Form</title>
    <link rel="stylesheet" href="styles.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="form-container">
        <form>
            <h2>Contact Us</h2>
            <label for="name">Name:<input type="text" id="name" name="name" required></label>
            <label for="email">Email:<input type="email" id="email" name="email" required></label>
            <label for="message">Message:
                <textarea id="message" name="message" rows="3" placeholder="Type in a message" required></textarea>
            </label>
            <button type="submit">Submit</button>
        </form>
    </div>
<p role="status" id="demo-status">Demo: Eingaben werden nicht gesendet oder gespeichert.</p>
<script src="demo.js" defer></script>
</body>

</html>
